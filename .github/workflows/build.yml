name: Build VST3
on:
  workflow_dispatch:
  push:
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Telecharger JUCE
        run: git clone --depth 1 https://github.com/juce-framework/JUCE.git
      - name: Configurer
        run: cmake -B build
      - name: Compiler
        run: cmake --build build --config Release
      - uses: actions/upload-artifact@v4
        with:
          name: FUCKANTUNE-VST3
          path: build/FuckAnTune_artefacts/Release/VST3/
